<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="{{ url_for('static', filename='adapt.js') }}"></script>
    <title>{% block title %}Sign in · NetSync{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Sora:wght@500;600;700&display=swap">
    <script>
        /* Apply the saved theme before first paint (same keys the rest of the app uses). */
        (function () {
            var root = document.documentElement, mode = null, color = null;
            try { mode = localStorage.getItem('ns_mode'); color = localStorage.getItem('ns_color'); } catch (e) {}
            if (!mode) mode = (window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark';
            if (mode === 'light') root.classList.add('light-mode');
            if (color === 'red') root.classList.add('theme-red');
        })();
    </script>
    <style>
        :root {
            /* Stage: always graphite, like the inside of a network cabinet */
            --stage: #1a2027;
            --stage-text: #f2f5f7;
            --stage-muted: #9fb0be;

            /* Form side: dark by default, light via .light-mode */
            --surface: #12171c;
            --card: rgba(16, 21, 26, .86);
            --card-line: rgba(255, 255, 255, .10);
            --field: #1b222a;
            --line: #36424e;
            --text: #eef2f5;
            --muted: #a3b1bd;
            --link: #8db7ff;
            --primary: #2a64d4;
            --primary-hover: #3470e4;
            --on-primary: #ffffff;
            --danger-bg: rgba(255, 99, 82, .12);
            --danger-line: #ff7a68;
            --danger-text: #ffb4a8;
            --focus: #8db7ff;
        }
        html.light-mode {
            --surface: #f3f5f7;
            --card: rgba(246, 248, 250, .95);
            --card-line: rgba(255, 255, 255, .55);
            --field: #ffffff;
            --line: #bcc6cf;
            --text: #131a20;
            --muted: #4d5b68;
            --link: #1f5fc7;
            --primary: #1f5fc7;
            --primary-hover: #194fa8;
            --danger-bg: #fdecea;
            --danger-line: #c0392b;
            --danger-text: #8f2418;
            --focus: #1f5fc7;
        }
        html.theme-red { --primary: #c0392b; --primary-hover: #a93226; }
        html.theme-red:not(.light-mode) { --primary: #c8402f; --primary-hover: #d84c3b; }

        * { box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            margin: 0;
            font-family: 'Figtree', 'Segoe UI', system-ui, -apple-system, sans-serif;
            font-size: 16px;
            line-height: 1.45;
            color: var(--text);
            background: #0d1115;
        }

        .bg {
            position: fixed; inset: -24px; z-index: 0;
            background: #0d1115 url('{{ url_for("static", filename="fiber1.jpg") }}') center / cover no-repeat;
        }
        .scrim {
            position: fixed; inset: 0; z-index: 0;
            background: linear-gradient(100deg, rgba(12,17,22,.84) 0%, rgba(12,17,22,.58) 55%, rgba(12,17,22,.40) 100%);
        }

        .page { position: relative; z-index: 1; display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); min-height: 100%; }

        /* ---------- Stage (left) ---------- */
        .stage {
            background: transparent;
            color: var(--stage-text);
            display: flex;
            flex-direction: column;
            padding: 40px 48px 0;
            min-height: 100vh;
            min-height: 100dvh;
            overflow: hidden;
        }
        .wordmark { display: inline-flex; align-items: center; gap: 12px; font-family: 'Sora', 'Figtree', sans-serif; font-weight: 700; font-size: 26px; letter-spacing: .2px; }
        .wordmark svg { display: block; }
        .logo { display: block; width: clamp(240px, 22vw, 330px); height: auto; }
        .stage h2 {
            margin: 4vh 0 0;
            max-width: 22ch;
            font-family: 'Sora', 'Figtree', sans-serif;
            font-weight: 600;
            font-size: clamp(34px, 3.4vw, 52px);
            line-height: 1.05;
            letter-spacing: 0;
        }
        .stage p.lede { margin: 20px 0 0; max-width: 46ch; color: var(--stage-muted); font-size: 20px; line-height: 1.5; }
        .rack-wrap { flex: 1 1 0; min-height: 0; margin: 24px -48px 0; display: flex; align-items: flex-end; }
        .rack { width: 100%; height: 100%; display: block; font-family: 'Figtree', 'Segoe UI', sans-serif; }

        /* One orchestrated moment: link LEDs come on left to right */
        .led { fill: #2a333c; }
        .led.on, .led.amber { animation: led-on .3s ease-out both; animation-delay: calc(var(--i, 0) * 110ms + 350ms); }
        .led.on { --lit: #3ddc84; }
        .led.amber { --lit: #ffb020; }
        @keyframes led-on { from { fill: #2a333c; } to { fill: var(--lit); } }

        /* ---------- Form side (right) ---------- */
        .form-side { display: flex; align-items: center; justify-content: center; padding: 40px 32px; }
        .form-col {
            width: 100%; max-width: 480px; padding: 44px 44px 40px;
            background: var(--card); border: 1px solid var(--card-line); border-radius: 10px;
            -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
            box-shadow: 0 24px 60px rgba(0,0,0,.45);
        }
        .form-col h1 { margin: 0 0 6px; font-family: 'Sora', 'Figtree', sans-serif; font-weight: 700; font-size: 42px; line-height: 1.1; }
        .form-col .sub { margin: 0 0 32px; color: var(--muted); font-size: 18px; }

        .alert {
            margin: 0 0 20px;
            padding: 14px 16px;
            font-size: 16px;
            border-radius: 6px;
            border: 1px solid var(--danger-line);
            border-left-width: 4px;
            background: var(--danger-bg);
            color: var(--danger-text);
            font-size: 15px;
        }
        .alert { font-weight: 500; }
        .alert.ok { border-color: #2f9e6a; background: rgba(47, 158, 106, .14); color: #8be0b4; }
        html.light-mode .alert.ok { background: #e6f6ee; color: #1b6b45; }

        .field { margin-bottom: 22px; }
        .field label { display: block; margin-bottom: 8px; font-size: 16px; font-weight: 500; color: var(--text); }
        .control { position: relative; }
        .control input {
            width: 100%;
            height: 56px;
            padding: 0 16px;
            font: inherit;
            font-size: 18px;
            color: var(--text);
            background: var(--field);
            border: 1px solid var(--line);
            border-radius: 6px;
        }
        .control input::placeholder { color: var(--muted); opacity: .75; }
        .control input.has-toggle { padding-right: 68px; }
        .control input:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; border-color: transparent; }
        .toggle {
            position: absolute; top: 5px; right: 5px; height: 46px; padding: 0 14px;
            font: inherit; font-size: 16px; font-weight: 500;
            color: var(--link); background: transparent; border: 0; border-radius: 4px; cursor: pointer;
        }
        .toggle:focus-visible { outline: 2px solid var(--focus); }

        .submit {
            width: 100%; height: 58px; margin-top: 10px;
            font: inherit; font-weight: 600; font-size: 19px;
            color: var(--on-primary); background: var(--primary);
            border: 0; border-radius: 6px; cursor: pointer;
        }
        .submit:hover { background: var(--primary-hover); }
        .submit:focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }
        .submit[disabled] { opacity: .7; cursor: progress; }

        .help { margin: 26px 0 0; font-size: 16px; color: var(--muted); }

        /* ---------- Tablet / phone ---------- */
        @media (max-width: 860px) {
            .page { grid-template-columns: 1fr; }
            .stage { min-height: 0; padding: 28px 24px 0; align-items: center; text-align: center; }
            .logo { width: 220px; margin: 0 auto; }
            .stage h2 { display: block; margin: 20px auto 0; max-width: 24ch; font-size: 26px; }
            .stage p.lede { display: block; margin: 10px auto 0; max-width: 36ch; font-size: 16px; }
            .rack-wrap { display: none; }
            .form-side { align-items: flex-start; padding: 24px 16px 32px; }
            .form-col { padding: 28px 22px 26px; max-width: 480px; }
            .form-col .sub { font-size: 16px; margin-bottom: 24px; }
            .form-col h1 { font-size: 34px; }
        }
        @media (min-width: 861px) and (max-height: 760px) {
            .stage p.lede { display: none; }
            .stage h2 { margin-top: 3vh; }
            .logo { width: 230px; }
        }

        @media (min-width: 1700px) and (min-height: 900px) {
            .page { zoom: 1.25; }
            .stage { min-height: calc(100vh / 1.25); min-height: calc(100dvh / 1.25); }
        }
        @media (min-width: 2300px) and (min-height: 1200px) {
            .page { zoom: 1.6; }
            .stage { min-height: calc(100vh / 1.6); min-height: calc(100dvh / 1.6); }
        }
        @media (prefers-reduced-motion: reduce) {
            .led.on, .led.amber { animation: none; fill: var(--lit); }
        }
        .btn-secondary {
            display: flex; align-items: center; justify-content: center;
            width: 100%; height: 54px; font: inherit; font-weight: 600; font-size: 18px;
            color: var(--text); background: transparent; text-decoration: none;
            border: 1px solid var(--line); border-radius: 6px; cursor: pointer;
        }
        .btn-secondary:hover { border-color: var(--link); color: var(--link); }
        .btn-secondary:focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }
        .divider { display: flex; align-items: center; gap: 14px; margin: 22px 0 18px; color: var(--muted); font-size: 14px; }
        .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: var(--line); }
        .link-row { display: flex; justify-content: space-between; gap: 12px; margin: 20px 0 0; font-size: 16px; }
        .link-row a, .help a, a.back { color: var(--link); text-decoration: none; font-weight: 500; }
        .link-row a:hover, .help a:hover, a.back:hover { text-decoration: underline; }
        .code-input { text-align: center; letter-spacing: .5em; font-size: 28px !important; font-weight: 600; padding-left: 24px !important; }
        .linkbtn { font: inherit; font-size: 16px; font-weight: 500; color: var(--link); background: none; border: 0; padding: 0; cursor: pointer; }
        .linkbtn:hover:not([disabled]) { text-decoration: underline; }
        .linkbtn[disabled] { color: var(--muted); cursor: not-allowed; }
        .hint { margin: -10px 0 22px; font-size: 14px; color: var(--muted); }
    </style>
    <link rel="stylesheet" href="{{ url_for('static', filename='adapt.css') }}">
</head>
<body>

<div class="scrim" aria-hidden="true"></div>
